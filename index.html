<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>النسيم ترافل | عمرة • تأشيرات • طيران • فنادق</title>
<meta name="description" content="النسيم ترافل: برامج عمرة، تأشيرات عمرة، تأشيرة السعودية السياحية بضمان الإصدار، الإمارات، تركيا، البحرين، تذاكر طيران وفنادق. اتصل أو واتساب 01021762000">
<meta property="og:title" content="النسيم ترافل | نسيمك لعالم أسهل">
<meta property="og:description" content="برامج عمرة وتأشيرات بضمان الإصدار وطيران وفنادق. اتصل أو واتساب 01021762000">
<meta property="og:image" content="assets/site/hero-haram.jpg">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a2c63;--blue:#16469a;--orange:#f07c00;--orange2:#ffb547;--bg:#f4f7fc;--ink:#11203d;--muted:#5d6b85;--line:#e1e7f2;--green:#22a861;--wa:#25D366}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Cairo",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:84px}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);box-shadow:0 2px 14px rgba(10,44,99,.08)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;height:68px}
.nav .logo img{height:48px;width:auto}
.nav ul{display:flex;gap:20px;list-style:none;font-weight:800;color:var(--navy)}
.nav ul a:hover,.nav ul a.on{color:var(--orange)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;border-radius:999px;padding:10px 20px;border:0;cursor:pointer;font-family:inherit;font-size:16px;white-space:nowrap}
.btn svg{width:20px;height:20px;flex:0 0 20px}
.b-wa{background:var(--wa);color:#fff}
.b-call{background:var(--navy);color:#fff}
.b-or{background:linear-gradient(180deg,var(--orange2),var(--orange));color:#fff}
@media(max-width:900px){.nav ul{display:none}}

.hero{position:relative;color:#fff;min-height:440px;display:flex;align-items:center;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,44,99,.3),rgba(10,44,99,.92) 70%)}
.hero .wrap{position:relative;z-index:2;padding:50px 16px}
.hero h1{font-weight:900;font-size:clamp(32px,6vw,58px);line-height:1.15;max-width:640px}
.hero h1 b{color:var(--orange2)}
.hero p{font-size:clamp(17px,2.2vw,21px);font-weight:600;margin:14px 0 22px;max-width:560px}
.acts{display:flex;gap:10px;flex-wrap:wrap}

section{padding:48px 0}
.st{text-align:center;margin-bottom:26px}
.st h2{font-weight:900;font-size:clamp(26px,4vw,38px);color:var(--navy);line-height:1.3}
.st p{color:var(--muted);font-weight:700;font-size:17px}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.cat{position:relative;border-radius:24px;overflow:hidden;min-height:250px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;box-shadow:0 10px 26px rgba(10,44,99,.15);transition:transform .2s;background:linear-gradient(140deg,var(--blue),var(--navy))}
.cat:hover{transform:translateY(-4px)}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,44,99,.05) 20%,rgba(10,44,99,.92))}
.cat .ic{position:absolute;top:14px;right:22px;font-size:52px;z-index:2}
.cat .n{position:absolute;top:16px;left:16px;z-index:2;background:var(--orange);font-weight:900;border-radius:999px;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.cat h3,.cat p,.cat .go{position:relative;z-index:2}
.cat h3{font-weight:900;font-size:26px;line-height:1.3}
.cat p{font-weight:700;opacity:.92}
.cat .go{margin-top:10px;align-self:flex-start;background:#fff;color:var(--navy);font-weight:900;border-radius:999px;padding:4px 18px 7px}

/* section page */
.page-head{background:linear-gradient(140deg,var(--blue),var(--navy));color:#fff;padding:34px 0;position:relative;overflow:hidden}
.page-head>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.page-head::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,44,99,.35),rgba(10,44,99,.93) 65%)}
.page-head .wrap{position:relative;z-index:2}
.card .top.ph{min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.card .top.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .top.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,44,99,.1),rgba(10,44,99,.9))}
.card .top.ph>*:not(img){position:relative;z-index:2}
.cat .ic{text-shadow:0 4px 14px rgba(0,0,0,.4)}
.credits{font-size:12px;opacity:.6;margin-top:8px}
.page-head .back{display:inline-flex;align-items:center;gap:6px;font-weight:800;background:rgba(255,255,255,.15);border-radius:999px;padding:4px 16px 6px;margin-bottom:10px}
.page-head h1{font-weight:900;font-size:clamp(28px,5vw,44px);line-height:1.2}
.page-head p{font-weight:700;opacity:.9}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tabs a{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 16px 6px;font-weight:800}
.tabs a.on{background:#fff;color:var(--navy)}

.disc{background:linear-gradient(90deg,#fff3e0,#ffe2bd);border:2px solid var(--orange);color:#7a3d00;border-radius:20px;padding:14px 18px;font-weight:900;font-size:18px;text-align:center;margin-bottom:22px}
.sub-h{font-weight:900;color:var(--navy);font-size:26px;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.sub-h::before{content:"";width:8px;height:30px;border-radius:4px;background:var(--orange)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
@media(max-width:400px){.cards{grid-template-columns:1fr}}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 22px rgba(10,44,99,.08);overflow:hidden;display:flex;flex-direction:column}
.card .top{background:var(--navy);color:#fff;padding:16px 18px;position:relative}
.card .top h3{font-weight:900;font-size:23px;line-height:1.3;padding-left:96px}
.card .top.nd h3{padding-left:0}
.card .top .d{position:absolute;top:14px;left:14px;background:var(--orange);font-weight:900;border-radius:999px;padding:2px 14px 5px;font-size:15px}
.card .top .meta{font-weight:700;color:var(--orange2);font-size:15px}
.card .body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.info{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:15px;color:var(--muted)}
.info b{color:var(--ink)}
.from{font-weight:800;color:var(--navy)}
.from b{color:var(--orange);font-size:26px;font-weight:900}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:15px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{background:#fff3e0;color:#9a4d00;font-weight:900;font-size:14px;line-height:1.3}
th small{display:block;color:var(--muted);font-weight:700;font-size:11px}
td:first-child,th:first-child{text-align:right;font-weight:900;color:var(--navy);background:#f6f8fc}
td{font-weight:800}
td.min{color:var(--orange);background:#fff8ee}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.mh{background:#eef3fb;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;color:var(--navy)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f6f8fc;border-radius:12px;padding:8px 12px;font-weight:700}
.opt b{font-weight:900;color:var(--navy);white-space:nowrap}
.opt.strong{background:#eef3fb}
.opt.best{background:#fff3e0;border:2px solid var(--orange)}
.opt.best b{color:var(--orange)}
.notes{list-style:none;display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:15px}
.notes li::before{content:"✓";color:var(--green);font-weight:900;margin-left:8px}
.card .acts{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card .acts .btn{padding:10px 8px}
.tag2{display:inline-block;background:rgba(255,255,255,.15);border-radius:999px;padding:0 12px 3px;font-size:14px;font-weight:800;margin-top:4px}

.why{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.w{background:#fff;border-radius:20px;padding:20px;text-align:center}
.w .i{font-size:36px}
.w h3{font-weight:900;color:var(--navy);font-size:20px}
.w p{color:var(--muted);font-weight:600}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.locs a{background:#fff;border-radius:16px;padding:14px 16px;font-weight:800;color:var(--navy);box-shadow:0 4px 14px rgba(10,44,99,.06);display:flex;align-items:center;gap:8px}
.locs a:hover{color:var(--orange)}
.cta{background:linear-gradient(140deg,var(--blue),var(--navy));color:#fff;border-radius:26px;padding:30px 20px;text-align:center}
.cta h2{font-weight:900;font-size:clamp(24px,4vw,34px)}
.cta .num{display:block;font-weight:900;font-size:clamp(34px,7vw,52px);color:var(--orange2);direction:ltr;margin:4px 0 14px}
.cta .acts{justify-content:center}
.simple{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 22px rgba(10,44,99,.08);max-width:760px;margin:0 auto}
.simple ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:17px;margin-bottom:16px}
.simple li::before{content:"✓";color:var(--green);font-weight:900;margin-left:8px}
footer{background:var(--navy);color:#cdd7ea;text-align:center;padding:26px 0;font-weight:700}
footer .s{color:var(--orange2);font-weight:900;font-size:20px}
.fab{position:fixed;bottom:0;left:0;right:0;z-index:60;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;background:rgba(255,255,255,.97);box-shadow:0 -4px 16px rgba(10,44,99,.12)}
.fab .btn{font-size:17px;padding:12px}
@media(min-width:900px){.fab{left:auto;right:20px;bottom:20px;background:none;box-shadow:none;grid-template-columns:auto auto}}
.hide{display:none!important}
</style>
</head>
<body>
<header><div class="wrap nav">
 <a class="logo" href="#"><img src="logo.png" alt="النسيم ترافل"></a>
 <ul id="menu"></ul>
 <a class="btn b-call" data-call href="#"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><span id="hphone"></span></a>
</div></header>

<main id="app"></main>

<footer><div class="wrap"><div class="s" id="slogan"></div><div>عمرة • تأشيرات • طيران • فنادق</div><div id="fphone" style="direction:ltr"></div><div class="credits" id="credits"></div></div></footer>

<div class="fab">
 <a class="btn b-wa" data-wa="أهلاً، عايز أستفسر" href="#"><svg viewBox="0 0 32 32"><path fill="currentColor" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm7.3 18.4c-.3.9-1.8 1.7-2.5 1.8-.7.1-1.5.2-4.6-1.1a14.6 14.6 0 0 1-5.6-5c-.4-.6-1.4-1.9-1.4-3.6s.9-2.6 1.2-3c.3-.3.7-.4 1-.4h.7c.2 0 .5-.1.8.6l1.1 2.6c.1.2.2.4 0 .7l-.4.6-.5.6c-.2.2-.4.4-.2.8a10 10 0 0 0 4.6 4c.4.2.6.1.8-.1l1.1-1.3c.3-.4.5-.3.8-.2l2.5 1.2c.4.2.6.3.7.4.1.2.1.9-.2 1.8z"/></svg>واتساب</a>
 <a class="btn b-call" data-call href="#"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>اتصل بينا</a>
</div>

<script src="data.js?v=3"></script>
<script>
(function(){
const S = window.SITE, app = document.getElementById("app");
const fmt = n => Number(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vis = a => (a || []).filter(x => !x.hidden);
const waLink = msg => "https://wa.me/" + S.whatsapp + "?text=" + encodeURIComponent(msg);
const telLink = "tel:" + S.phone;
const ROOM = {"خماسي":"5 في الغرفة","رباعي":"4 في الغرفة","ثلاثي":"3 في الغرفة","ثنائي":"2 في الغرفة","فردي":"غرفة لوحدك"};
const WA_SVG = '<svg viewBox="0 0 32 32"><path fill="currentColor" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm7.3 18.4c-.3.9-1.8 1.7-2.5 1.8-.7.1-1.5.2-4.6-1.1a14.6 14.6 0 0 1-5.6-5c-.4-.6-1.4-1.9-1.4-3.6s.9-2.6 1.2-3c.3-.3.7-.4 1-.4h.7c.2 0 .5-.1.8.6l1.1 2.6c.1.2.2.4 0 .7l-.4.6-.5.6c-.2.2-.4.4-.2.8a10 10 0 0 0 4.6 4c.4.2.6.1.8-.1l1.1-1.3c.3-.4.5-.3.8-.2l2.5 1.2c.4.2.6.3.7.4.1.2.1.9-.2 1.8z"/></svg>';
const CALL_SVG = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
const acts = msg => `<div class="acts"><a class="btn b-wa" href="${waLink(msg)}" target="_blank" rel="noopener">${WA_SVG}احجز واتساب</a><a class="btn b-call" href="${telLink}">${CALL_SVG}اتصل</a></div>`;

document.getElementById("hphone").textContent = S.phone;
document.getElementById("fphone").textContent = S.phone;
document.getElementById("slogan").textContent = S.slogan;
document.getElementById("credits").textContent = S.credits || "";
document.querySelectorAll("[data-call]").forEach(a => a.href = telLink);
document.querySelectorAll("[data-wa]").forEach(a => { a.href = waLink(a.dataset.wa); a.target = "_blank"; });
document.getElementById("menu").innerHTML = vis(S.sections).map(s => `<li><a href="#${s.id}" data-m="${s.id}">${esc(s.title)}</a></li>`).join("") + '<li><a href="#locations" data-m="locations">لوكيشنز</a></li>';

const sections = vis(S.sections);
function catCards(){
  return `<div class="cats">${sections.map((s,i) => `<a class="cat" href="#${s.id}">${s.img ? `<img src="${s.img}" alt="" loading="lazy">` : ""}${s.icon ? `<span class="ic">${s.icon}</span>` : ""}<span class="n">${i+1}</span><h3>${esc(s.title)}</h3><p>${esc(s.sub||"")}</p><span class="go">ادخل ←</span></a>`).join("")}</div>`;
}
function ctaBox(t){
  return `<section style="padding-top:10px"><div class="wrap"><div class="cta"><h2>${esc(t||"احجز دلوقتي – كلمنا اتصال أو واتساب")}</h2><a class="num" href="${telLink}">${S.phone}</a><div class="acts"><a class="btn b-wa" href="${waLink("أهلاً، عايز أحجز")}" target="_blank" rel="noopener" style="font-size:18px;padding:12px 26px">${WA_SVG}واتساب</a><a class="btn b-or" href="${telLink}" style="font-size:18px;padding:12px 26px">${CALL_SVG}اتصال</a></div></div></div></section>`;
}
function locs(){
  const L = vis(S.locations); if(!L.length) return "";
  return `<section id="locations"><div class="wrap"><div class="st"><h2>اللوكيشنز</h2><p>مراكز تأشير اللي بنحجزلك فيها الميعاد</p></div><div class="locs">${L.map(l => `<a href="${l.url}" target="_blank" rel="noopener">📍 ${esc(l.name)}</a>`).join("")}</div></div></section>`;
}
function home(){
  return `
  <section class="hero"><img src="assets/site/hero-haram.jpg" alt=""><div class="wrap">
   <h1>النسيم ترافل <b>نسيمك لعالم أسهل</b></h1>
   <p>برامج عمرة، تأشيرات بضمان الإصدار، تذاكر طيران وفنادق — اختار اللي محتاجه وإحنا معاك لحد ما ترجع.</p>
   <div class="acts"><a class="btn b-or" href="#umrah" style="font-size:18px;padding:12px 26px">برامج العمرة</a><a class="btn b-wa" href="${waLink("أهلاً، عايز أستفسر")}" target="_blank" rel="noopener" style="font-size:18px;padding:12px 26px">${WA_SVG}واتساب</a></div>
  </div></section>
  <section><div class="wrap"><div class="st"><h2>اختار الخدمة</h2><p>دوس على القسم وهتلاقي كل التفاصيل والأسعار</p></div>${catCards()}</div></section>
  <section style="padding-top:0"><div class="wrap"><div class="why">
   <div class="w"><div class="i">🛡️</div><h3>ضمان الإصدار</h3><p>لو التأشيرة اترفضت فلوسك كلها بترجعلك.</p></div>
   <div class="w"><div class="i">📋</div><h3>نراجع أوراقك الأول</h3><p>قبل أي تقديم بنراجع كل حاجة معاك.</p></div>
   <div class="w"><div class="i">👨‍👩‍👧‍👦</div><h3>خصم للمجموعات</h3><p>كل ما العدد يزيد السعر يقل.</p></div>
   <div class="w"><div class="i">🔔</div><h3>معاك لحد ما ترجع</h3><p>تذكير قبل كل ميعاد ومتابعة لرحلتك.</p></div>
  </div></div></section>
  ${locs()}${ctaBox()}`;
}
function head(id, title, sub, tabs){
  const sec = sections.find(x=>x.id===id)||{};
  return `<div class="page-head">${sec.img?`<img src="${sec.img}" alt="">`:""}<div class="wrap"><a class="back" href="#">→ الرئيسية</a><h1>${esc(title)}</h1><p>${esc(sub||"")}</p><div class="tabs">${sections.map(s => `<a href="#${s.id}" class="${s.id===id?"on":""}">${esc(s.title)}</a>`).join("")}</div></div></div>`;
}
function program(p){
  const rooms = Object.keys(p.prices);
  const all = rooms.flatMap(r => p.prices[r]); const min = Math.min(...all);
  const hs = p.hotels.map(h => `<th><small>فندق مكة</small>${esc(h)}</th>`).join("");
  const rows = rooms.map(r => `<tr><td>${r}<br><small style="color:var(--muted);font-size:11px;white-space:nowrap">${ROOM[r]||""}</small></td>${p.prices[r].map(v => `<td class="${v===min?"min":""}">${fmt(v)}</td>`).join("")}</tr>`).join("");
  return `<div class="card"><div class="top"><span class="d">${esc(p.date)}</span><h3>${esc(p.title)}</h3><div class="meta">${esc(p.nights)}</div></div><div class="body">
   <div class="from">يبدأ من <b>${fmt(min)}</b> جنيه للفرد</div>
   <div class="info"><span>✈️ الطيران: <b>${esc(p.airline)}</b></span><span>📍 خط السير: <b>${esc(p.route)}</b></span></div>
   <div class="tw"><table><tr><th>الغرفة</th>${hs}</tr>${rows}</table></div>
   <div class="mh">🕌 فندق المدينة: ${esc(p.madinah || S.madinahHotel)}</div>
   ${p.notes ? `<ul class="notes">${p.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>` : ""}
   ${acts(`أهلاً، عايز أحجز ${p.title} – ${p.date} (${p.airline})`)}
  </div></div>`;
}
function visaCard(v, img){
  img = v.img || img;
  return `<div class="card"><div class="top nd ${img?"ph":""}">${img?`<img src="${img}" alt="" loading="lazy">`:""}<h3>${esc(v.title)}</h3>${v.tag?`<span class="tag2">${esc(v.tag)}</span>`:""}</div><div class="body">
   ${v.options && v.options.length ? `<div class="opts">${v.options.map(o => `<div class="opt ${o.strong?"strong":""} ${o.best?"best":""}"><span>${esc(o.name)}</span><b>${fmt(o.price)} ج</b></div>`).join("")}</div>` : ""}
   ${v.price ? `<div class="from">السعر <b>${fmt(v.price)}</b> جنيه</div>` : ""}
   ${(v.notes||v.points||[]).length ? `<ul class="notes">${(v.notes||v.points).map(n=>`<li>${esc(n)}</li>`).join("")}</ul>` : ""}
   ${acts(`أهلاً، عايز أستفسر عن ${v.title}`)}
  </div></div>`;
}
function umrah(){
  return head("umrah","العمرة","برامج عمرة كاملة وتأشيرات عمرة") + `<section><div class="wrap">
   ${S.umrahDiscount?`<div class="disc">${esc(S.umrahDiscount)}</div>`:""}
   <h2 class="sub-h">برامج العمرة</h2>
   <div class="cards">${vis(S.umrahPrograms).map(program).join("")}</div>
   <p style="color:var(--muted);font-weight:700;margin-top:10px">* الأسعار بالجنيه المصري للفرد الواحد</p>
   <h2 class="sub-h">تأشيرات العمرة</h2>
   <div class="cards">${vis(S.umrahVisas).map(v => visaCard(v, S.umrahVisasImg)).join("")}</div>
  </div></section>${ctaBox("احجز عمرتك – كلمنا اتصال أو واتساب")}`;
}
function visas(){
  return head("visas","التأشيرات السياحية","أسعار واضحة، وبضمان إصدار لو حابب") + `<section><div class="wrap">
   <div class="disc" style="background:#e9f8ef;border-color:var(--green);color:#11603a">🛡️ بضمان الإصدار = لو التأشيرة اترفضت فلوسك كلها بترجعلك</div>
   <div class="cards">${vis(S.visas).map(v => visaCard(v)).join("")}</div>
  </div></section>${ctaBox("ابعت صورة الباسبور على واتساب ونبدأ")}`;
}
function simple(id, title, sub, points, msg){
  return head(id,title,sub) + `<section><div class="wrap"><div class="simple"><ul>${points.map(p=>`<li>${p}</li>`).join("")}</ul>${acts(msg)}</div></div></section>${ctaBox()}`;
}
function render(){
  const h = (location.hash||"").slice(1);
  let html;
  if(h==="umrah") html = umrah();
  else if(h==="visas") html = visas();
  else if(h==="flights") html = simple("flights","حجز تذاكر الطيران","لكل الدول بأفضل سعر متاح",["ابعتلنا الوجهة وتاريخ الذهاب والعودة وعدد المسافرين","نطلعلك أرخص وأنسب رحلة وترانزيت مريح","تذكير قبل الطيارة بيوم وقبلها بـ 4 ساعات"],"أهلاً، عايز أحجز تذكرة طيران من ... إلى ... بتاريخ ...");
  else if(h==="hotels") html = simple("hotels","حجز الفنادق","مكة والمدينة وكل الدول",["فنادق مكة والمدينة قريبة من الحرم وعلى ميزانيتك","فنادق في كل الدول","تأكيد الحجز وتذكير بميعاد الدخول"],"أهلاً، عايز أحجز فندق في ... من ... لـ ...");
  else html = home();
  app.innerHTML = html;
  document.querySelectorAll("[data-m]").forEach(a => a.classList.toggle("on", a.dataset.m===h));
  if(h==="locations"){ const el=document.getElementById("locations"); el && el.scrollIntoView(); }
  else window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);
render();
})();
</script>
</body>
</html>
