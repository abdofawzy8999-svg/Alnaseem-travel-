name: rihlat-notify
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: rihlat-notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/653351622764/locations/global/workloadIdentityPools/github/providers/github
          service_account: rihlat-notifier@naseem-rihlat.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install libraries
        working-directory: rihlat/notifier
        run: npm install --no-save --no-audit --no-fund @google-cloud/firestore@7.11.0 google-auth-library@9.15.0
      - name: Send due notifications
        working-directory: rihlat/notifier
        env:
          FIREBASE_PROJECT: naseem-rihlat
          APP_URL: https://abdofawzy8999-svg.github.io/Alnaseem-travel-/rihlat/
        run: node notify.mjs
      - name: Keep the schedule alive (GitHub pauses idle schedules after 60 days)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now-last)) -gt 3888000 ]; then
            date -u > rihlat/notifier/.keepalive
            git config user.name "naseem-bot"; git config user.email "naseem-bot@users.noreply.github.com"
            git add rihlat/notifier/.keepalive && git commit -m "keepalive" && git push
          fi
